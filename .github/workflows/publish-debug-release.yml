name: Publish Debug APK Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-debug-release:
    name: Publish debug APK prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Publish GitHub prerelease with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: debug-${{ github.sha }}
          TITLE: Debug APK (${{ github.sha }})
        run: |
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --generate-notes \
            --prerelease
